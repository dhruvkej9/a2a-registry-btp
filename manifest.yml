---
applications:
- name: a2a-agent-registry
  memory: 256M
  instances: 1
  buildpacks:
    - nodejs_buildpack
  command: node server.js
  services:
    - my-object-store        # <-- apne existing Object Store instance ka naam yahan
  env:
    REGISTRY_BUCKET: agent-registry   # <-- bucket ka naam (Object Store me auto-create hota hai)
    REGISTRY_FOLDER: registry/poc     # <-- folder inside bucket (isi me registry.json save hoga)
